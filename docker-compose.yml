version: '3'
services:
  db:
    image: postgis/postgis:14-3.3
    environment:
      DATABASE_HOST: localhost
      POSTGRES_DB: ramas_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test_db:
    image: postgis/postgis:14-3.3
    environment:
      DATABASE_HOST: db
      POSTGRES_DB: ramas_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

  prod_db:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: ramas_prod
      POSTGRES_USER: ramas_postgres
      POSTGRES_PASSWORD: rbr123qwe
    ports:
      - "5434:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ramas_dev
    depends_on:
      - db
    command: --config /config/martin.yaml
    volumes:
      - ./martin:/config

  martin_prod:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    ports:
      - "3031:3000"
    environment:
      - DATABASE_URL=postgresql://ramas_postgres:rbr123qwe@prod_db:5432/ramas_prod
    depends_on:
      - prod_db
    command: --config /config/martin.yaml
    volumes:
      - ./martin:/config

  web:
    build:
      context: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"
    volumes:
      - .:/RamasBackend
    ports:
      - "3000:3000"
    depends_on:
      - db
      - martin

  test_web:
    build:
      context: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rspec"
    volumes:
      - .:/RamasBackend
    depends_on:
      - test_db

  prod_web:
    build:
      context: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0' -e production"
    volumes:
      - .:/RamasBackend
    ports:
      - "3001:3000"
    depends_on:
      - prod_db
      - martin_prod

volumes:
  postgres_data:
  test_postgres_data:
  prod_postgres_data:
