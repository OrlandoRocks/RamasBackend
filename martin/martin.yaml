# Martin Vector Tile Server Configuration
# Documentation: https://maplibre.org/martin/

listen_addresses: '0.0.0.0:3030'

# Enable CORS for frontend access
cors: true

# PostgreSQL/PostGIS connection
postgres:
  connection_string: ${DATABASE_URL}

  functions:
    geo_layers:
      schema: public
      function: geo_layers_mvt
      minzoom: 0
      maxzoom: 22
      # Legacy test data (CDMX area) in geo_layers_geom
      bounds: [-99.17, 19.40, -99.12, 19.43]

    lands:
      schema: public
      function: lands_mvt
      minzoom: 0
      maxzoom: 22
      # Covers imported parcels (e.g. Valle Dorado, Chihuahua) and other developments
      bounds: [-107.0, 18.5, -98.5, 29.5]
